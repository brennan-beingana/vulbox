# Technology → attack profile catalog.
#
# Maps a detected stack tag (produced by StackDetector.tags()) to a prioritized
# list of MITRE ATT&CK techniques to *proactively* queue, independent of whether
# Trivy flagged a matching CVE. This is the stack-aware counterpart to the
# reactive CVE→technique map in cve_technique_map.generated.yml.
#
# Selection model: build_queue() unions the techniques of every profile whose
# key is in the detected tag set, in the file order below (framework profiles
# are listed after their base language so they layer on top). Deduped against
# techniques already queued by CVE-driven matches.
#
# INVARIANT: every technique listed here must be executable — backed either by a
# vendored atomic under data/sources/atomics/<id>/ or by a hand-written probe in
# scanners/atomic_runner.sh. tests/test_tech_profiles.py enforces this so the
# catalog can never reference a technique that produces "not applicable".

profiles:
  # ---- Languages (base layers) ----
  python:
    description: "Python runtime — interpreter abuse + local recon/credential exposure."
    techniques:
      - id: T1059.006
        reason: "Python interpreter present — command/script execution."
      - id: T1059.004
        reason: "Shell available alongside the interpreter."
      - id: T1552.001
        reason: "Credentials commonly left in .env / settings files."
      - id: T1083
        reason: "File and directory discovery to map the app layout."
      - id: T1082
        reason: "System information discovery baseline."

