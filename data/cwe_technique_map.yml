# CWE → MITRE ATT&CK technique bridge.
#
# Two consumers:
#   1. scripts/build_cve_map.py — maps CISA KEV CVEs not in the attack_to_cve
#      curated set (one (CVE → technique) row per CWE hit).
#   2. app.adapters.art_adapter — the scan-time fallback. When a Trivy finding's
#      CVE isn't in the CVE→technique map, the adapter bridges the finding's
#      own CweIDs through this table so the CVE still yields a technique to
#      test (provenance "cwe-bridge"), instead of being dropped from the queue.
#
# Coverage target: the top ~60–80 CWEs in KEV cover the long tail. Adding more
# is cheap — append entries and re-run the builder.
#
# Calls are conservative: ambiguous CWEs (e.g. CWE-20 "improper input
# validation") map to the most-likely *exploitation* technique (T1190), not
# the broadest possible post-exploitation behaviour. Refine via overrides in
# cve_technique_map.yml when a specific CVE deserves better.

mappings:

  # --- Injection / RCE family ----------------------------------------------
  - cwe: CWE-20      # Improper Input Validation (generic; usually network-exposed → exploit)
    technique: T1190
  - cwe: CWE-74      # Improper Neutralization of Special Elements
    technique: T1059
  - cwe: CWE-77      # Command Injection (generic)
    technique: T1059
  - cwe: CWE-78      # OS Command Injection
    technique: T1059.004
  - cwe: CWE-79      # Cross-Site Scripting
    technique: T1059.007
  - cwe: CWE-89      # SQL Injection
    technique: T1190
  - cwe: CWE-94      # Code Injection
    technique: T1059
  - cwe: CWE-95      # Eval Injection
    technique: T1059
  - cwe: CWE-138     # Improper Neutralization of Special Elements
    technique: T1059
  - cwe: CWE-434     # Unrestricted File Upload (typical foothold: web shell)
    technique: T1505.003
  - cwe: CWE-502     # Deserialization of Untrusted Data
    technique: T1059
  - cwe: CWE-611     # XML External Entity (XXE)
    technique: T1190
  - cwe: CWE-918     # Server-Side Request Forgery (SSRF)
    technique: T1190

