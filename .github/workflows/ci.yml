name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v --tb=short
        # pytest.ini's addopts already excludes -m e2e

  e2e:
    name: end-to-end pipeline
    # Trigger: every push to main, plus PRs that opt in with the `run-e2e` label.
    # The label gate keeps PR runs fast unless someone explicitly wants the
    # slow real-Docker-build path.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Trivy
        # Pinned version keeps the CVE-database compatibility window stable
        # across runs; bump deliberately when refreshing fixtures.
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy=0.50.4
          trivy --version

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-v1
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Pre-download Trivy DB
        run: trivy image --download-db-only

      - name: Pre-pull base image
        # The vulnerable_target fixture builds FROM node:14-alpine. Pulling
        # ahead of time gives a clearer failure than mid-build hub flakes.
        run: docker pull node:14-alpine

      - name: Run E2E pipeline
        # Falco needs kernel-module access, which GitHub-hosted runners don't
        # grant. The bundled E2E test is shaped to run without it (Falco off
        # → is_detectable is uniformly false, matrix still has signal).
        env:
          VULBOX_DEV_MODE: "false"
          VULBOX_FALCO_ENABLED: "false"
        run: pytest -m "e2e and not requires_falco" -v --tb=short

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulbox-e2e-logs
          path: |
            data/runs/**/logs/**
            data/findings.db
          if-no-files-found: warn
          retention-days: 14
