[pytest]
testpaths = tests
markers =
    e2e: full-pipeline tests requiring Docker + Trivy (skipped by default; opt-in via `-m e2e`)
    requires_docker: needs a running Docker daemon
    requires_trivy: needs `trivy` CLI on PATH
    requires_falco: needs Falco installed and runnable
addopts = -m "not e2e"
